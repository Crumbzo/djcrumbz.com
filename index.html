<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ CRUMBZ — Worldwide</title>
<meta name="description" content="DJ CRUMBZ · Worldwide · Lord Commander of the Night's Watch. Mixes, music, streams and socials.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2bd6;--cyan:#00f0ff;--lime:#b6ff00;--bg:#05010d}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:#f3eaff;font-family:'Space Grotesk',sans-serif}
#bg{position:fixed;inset:0;z-index:0}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:12vh 20px 60px}
h1{font-family:Monoton,cursive;font-weight:400;font-size:clamp(3rem,13vw,9rem);line-height:1;text-align:center;color:#fff;
text-shadow:0 0 8px var(--pink),0 0 24px var(--pink),0 0 60px var(--pink);animation:flick 4s infinite}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.6}96%{opacity:1}97%{opacity:.7}}
.tag{text-align:center;margin:18px 0 6px;letter-spacing:.4em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 12px var(--cyan);font-weight:600}
.sub{text-align:center;color:#cbb8ff;opacity:.85}
h2{margin:64px 0 18px;font-size:.85rem;letter-spacing:.35em;text-transform:uppercase;color:var(--lime);text-shadow:0 0 10px var(--lime)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;perspective:900px}
.card{display:flex;flex-direction:column;justify-content:space-between;min-height:110px;padding:18px;border-radius:14px;text-decoration:none;color:#fff;
background:rgba(20,6,40,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,43,214,.35);
box-shadow:0 0 0 1px rgba(0,240,255,.08) inset;transform-style:preserve-3d;transition:transform .15s ease,box-shadow .25s,border-color .25s}
.card:hover,.card:focus-visible{border-color:var(--c,var(--cyan));box-shadow:0 0 18px var(--c,var(--cyan)),0 0 50px -10px var(--c,var(--cyan));outline:none}
.card b{font-size:1.15rem}.card span{font-size:.8rem;opacity:.65;word-break:break-all}
.card i{font-style:normal;font-size:.7rem;letter-spacing:.2em;color:var(--c,var(--cyan))}
footer{text-align:center;margin-top:70px;font-size:.8rem;opacity:.6}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
</style></head><body>
<canvas id="bg"></canvas>
<main>
<h1>CRUMBZ</h1>
<p class="tag">Worldwide</p>
<p class="sub">I AM the Lord Commander of the Night's Watch.</p>
<div id="sections"></div>
<footer>© <span id="y"></span> DJ CRUMBZ · djcrumbz.com</footer>
</main>
<script>
const links={
 "Listen":[["Spotify","open.spotify.com/artist/2k2QhoNmCp8GyjHLvW22q6","#1ed760"],["Apple Music","music.apple.com/us/artist/crumbz/1810829241","#ff2bd6"],["SoundCloud","soundcloud.com/djcrumbz","#ff7a00"],["Mixcloud","mixcloud.com/djcrumbz","#00f0ff"],["Bandcamp","djcrumbz.bandcamp.com","#00f0ff"],["iHeartRadio · 102.7 KISS FM","1027kissfm.iheart.com/featured/dj-crumbz/about/","#ff2b4e"],["Dropbox Archive","tinyurl.com/djcrumbz","#b6ff00"]],
 "Watch & Follow":[["Twitch","twitch.tv/djcrumbz","#a970ff"],["YouTube","youtube.com/djcrumbz","#ff2b4e"],["Instagram","instagram.com/djcrumbz","#ff2bd6"],["TikTok","tiktok.com/@djcrumbz","#00f0ff"],["X / Twitter","twitter.com/djcrumbz","#ffffff"],["Facebook","facebook.com/djcrumbz","#3d8bff"]],
 "Support":[["Venmo","venmo.com/djcrumbz","#00f0ff"],["Cash App","cash.app/$djcrumbz","#b6ff00"],["PayPal","paypal.me/djcrumbz","#3d8bff"]]};
const S=document.getElementById('sections');
for(const [t,arr] of Object.entries(links)){
 S.insertAdjacentHTML('beforeend',`<h2>${t}</h2><div class="grid">${arr.map(([n,u,c])=>`<a class="card" style="--c:${c}" href="https://${u}" target="_blank" rel="noopener"><i>▶ OPEN</i><div><b>${n}</b><br><span>${u.split('/')[0]}</span></div></a>`).join('')}</div>`);}
document.getElementById('y').textContent=new Date().getFullYear();
document.querySelectorAll('.card').forEach(c=>{c.onmousemove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${x*18}deg) rotateX(${-y*18}deg) translateZ(10px)`};c.onmouseleave=()=>c.style.transform=''});
</script>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
const cv=document.getElementById('bg'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene();sc.fog=new THREE.Fog(0x05010d,10,60);
const cam=new THREE.PerspectiveCamera(70,1,.1,200);cam.position.set(0,3,10);
const grid=new THREE.GridHelper(200,80,0xff2bd6,0x00f0ff);grid.position.y=-3;sc.add(grid);
const sun=new THREE.Mesh(new THREE.TorusKnotGeometry(1.8,.4,180,20),new THREE.MeshBasicMaterial({color:0xff2bd6,wireframe:true}));sun.position.set(0,.2,-24);sc.add(sun);
const ring=new THREE.Mesh(new THREE.TorusGeometry(3.6,.04,8,120),new THREE.MeshBasicMaterial({color:0x00f0ff}));ring.position.copy(sun.position);sc.add(ring);
const cubes=[];for(let i=0;i<40;i++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(Math.random()*.4+.15),new THREE.MeshBasicMaterial({color:[0xff2bd6,0x00f0ff,0xb6ff00][i%3],wireframe:true}));m.position.set((Math.random()-.5)*40,Math.random()*5-2,-Math.random()*40-6);sc.add(m);cubes.push(m)}
let mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
(function f(t){t*=.001;if(!still){grid.position.z=(t*4)%2.5;sun.rotation.x=t*.3;sun.rotation.y=t*.5;ring.rotation.z=t*.2;ring.rotation.x=Math.sin(t*.5)*.4;cubes.forEach((c,i)=>{c.rotation.x+=.005+i*1e-4;c.rotation.y+=.007})}
cam.position.x+=(mx*3-cam.position.x)*.05;cam.position.y+=(3-my*2+scrollY*.002-cam.position.y)*.05;cam.lookAt(0,1,-10);R.render(sc,cam);requestAnimationFrame(f)})(0);
</script>
</body></html>
